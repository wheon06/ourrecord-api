kakao-api:
  client-id: ${KAKAO_CLIENT_ID}

  core:
    base-url: https://kapi.kakao.com

  auth:
    base-url: https://kauth.kakao.com
    login:
      redirect-uri: http://localhost:8080/api/v1/auth/kakao
      client-secret: ${KAKAO_LOGIN_CLIENT_SECRET}

  map:
    base-url: https://dapi.kakao.com
